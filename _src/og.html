<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;background:#F3EEE5;color:#1B2331}

  .bottom b{font-weight:500;color:#9A7549;letter-spacing:.04em;text-transform:none;font-family:"Cormorant Garamond",serif;font-size:26px;font-style:italic}
  svg{position:absolute;right:84px;top:190px;width:210px;height:210px;fill:none;stroke:#D8CFBF;stroke-width:1.5;stroke-linecap:round}
  svg .a{stroke:#9A7549}
